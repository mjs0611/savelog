  <ellipse cx="50" cy="59" rx="12" ry="8" fill="#FF85A1" stroke="#4A2C2C" stroke-width="3" />
  <circle cx="46" cy="59" r="2.2" fill="#4A2C2C" />
  <circle cx="54" cy="59" r="2.2" fill="#4A2C2C" />

