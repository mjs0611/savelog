  <circle cx="93" cy="120" r="3.5" fill="#4A2C2C" />
  <circle cx="107" cy="120" r="3.5" fill="#4A2C2C" />

  <!-- Hip Retro Oval Sunglasses -->
  <!-- Left Lens -->
  <ellipse cx="74" cy="98" rX="14" ry="10" fill="#2D2D2D" stroke="#4A2C2C" stroke-width="4" />
  <circle cx="71" cy="95" r="3" fill="#FFF" />
  <!-- Right Lens -->
