<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears (partially covered by beanie) -->
  <circle cx="30" cy="32" r="10" fill="#FFB38A" stroke="#4A2C2C" stroke-width="3.5" />
  <circle cx="30" cy="32" r="5" fill="#FF85A1" />
  <circle cx="70" cy="32" r="10" fill="#FFB38A" stroke="#4A2C2C" stroke-width="3.5" />
  <circle cx="70" cy="32" r="5" fill="#FF85A1" />

  <!-- Main Head -->
  <circle cx="50" cy="58" r="30" fill="#FFB38A" stroke="#4A2C2C" stroke-width="3.5" />

  <!-- Cheek patches (white-ish) -->
  <ellipse cx="36" cy="66" rx="13" ry="11" fill="#FFF0E5" />
  <ellipse cx="64" cy="66" rx="13" ry="11" fill="#FFF0E5" />
  <circle cx="50" cy="58" r="30" fill="none" stroke="#4A2C2C" stroke-width="3.5" />

  <!-- Hip Beanie (Green Beanie!) -->
  <!-- Beanie Dome -->
  <path d="M 28 36 C 28 16, 72 16, 72 36 Z" fill="#34C759" stroke="#4A2C2C" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Beanie Cuff -->
  <rect x="23" y="32" width="54" height="10" rx="4" fill="#28A745" stroke="#4A2C2C" stroke-width="3.5" />

  <!-- Round Hipster Glasses -->
  <!-- Left Rim -->
  <circle cx="36" cy="52" r="9.5" fill="none" stroke="#4A2C2C" stroke-width="3" />
  <!-- Right Rim -->
  <circle cx="64" cy="52" r="9.5" fill="none" stroke="#4A2C2C" stroke-width="3" />
  <!-- Bridge -->
  <path d="M 45.5 52 L 54.5 52" stroke="#4A2C2C" stroke-width="3" />

  <!-- Eyes (Simple Dot Eyes inside rims) -->
  <circle cx="36" cy="52" r="3.2" fill="#4A2C2C" />
  <circle cx="64" cy="52" r="3.2" fill="#4A2C2C" />

  <!-- Blush Cheeks -->
  <circle cx="25" cy="60" r="4.5" fill="#FF527B" opacity="0.35" />
  <circle cx="75" cy="60" r="4.5" fill="#FF527B" opacity="0.35" />

  <!-- Nose & Mouth -->
  <polygon points="50,56 47,53 53,53" fill="#4A2C2C" />
  <path d="M 46 61 Q 50 64 54 61" fill="none" stroke="#4A2C2C" stroke-width="2.2" stroke-linecap="round" />

  <!-- Sunflower Seed (hamster is holding it at the bottom) -->
  <path d="M 50 70 C 45 77, 50 83, 50 83 C 50 83, 55 77, 50 70 Z" fill="#D2B48C" stroke="#4A2C2C" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="50" y1="70" x2="50" y2="83" stroke="#4A2C2C" stroke-width="1.2" />
</svg>
