  <circle cx="26" cy="56" r="5" fill="#FF527B" opacity="0.35" />
  <circle cx="74" cy="56" r="5" fill="#FF527B" opacity="0.35" />

  <!-- Cool Smile (Slightly smirked to one side for hipness) -->
