<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Mane (Back hair) -->
  <path d="M 68 28 C 82 28, 86 48, 76 66 C 70 76, 56 82, 56 82 Z" fill="#D1BBFF" stroke="#4A2C2C" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="70" cy="36" r="12" fill="#E8DFFF" />

  <!-- Ears -->
  <!-- Left Ear -->
  <path d="M 32 30 C 24 16, 20 24, 26 38 Z" fill="#FFD6E8" stroke="#4A2C2C" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Right Ear -->
  <path d="M 62 26 C 68 12, 72 20, 68 34 Z" fill="#FFD6E8" stroke="#4A2C2C" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head -->
  <circle cx="48" cy="54" r="30" fill="#FFD6E8" stroke="#4A2C2C" stroke-width="3.5" />

  <!-- Snout -->
  <ellipse cx="44" cy="64" rx="16" ry="11" fill="#FFB3D1" stroke="#4A2C2C" stroke-width="3" />
  <circle cx="38" cy="62" r="2" fill="#4A2C2C" />
  <circle cx="48" cy="62" r="2" fill="#4A2C2C" />

  <!-- Horn (Yellow) -->
  <path d="M 48 26 L 43 6 L 53 6 Z" fill="#FFEAA7" stroke="#4A2C2C" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="46" y1="18" x2="50" y2="14" stroke="#4A2C2C" stroke-width="2.5" />
  <line x1="45" y1="12" x2="49" y2="8" stroke="#4A2C2C" stroke-width="2.5" />

  <!-- Hip Y2K Star Sunglasses -->
  <!-- Left Star Rim -->
  <polygon points="34,36 37,42 44,42 39,46 41,53 34,49 27,53 29,46 24,42 31,42" fill="#FF2D55" stroke="#4A2C2C" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="34" cy="44" r="1.5" fill="#FFF" />
  <!-- Right Star Rim -->
  <polygon points="58,36 61,42 68,42 63,46 65,53 58,49 51,53 53,46 48,42 55,42" fill="#FF2D55" stroke="#4A2C2C" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="58" cy="44" r="1.5" fill="#FFF" />
  <!-- Bridge -->
  <path d="M 42 44 L 50 44" stroke="#4A2C2C" stroke-width="2.5" />

  <!-- Blush Cheeks -->
  <circle cx="24" cy="54" r="4.5" fill="#FF527B" opacity="0.35" />
  <circle cx="68" cy="54" r="4.5" fill="#FF527B" opacity="0.35" />

  <!-- Smile -->
  <path d="M 40 70 Q 44 73 48 70" fill="none" stroke="#4A2C2C" stroke-width="2.5" stroke-linecap="round" />
</svg>
