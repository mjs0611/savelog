<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Retro Foam Headphones - Headband -->
  <path d="M 20 46 A 32 32 0 0 1 80 46" fill="none" stroke="#4A2C2C" stroke-width="5.5" stroke-linecap="round" />

  <!-- Antennas -->
  <!-- Left Antenna -->
  <line x1="38" y1="28" x2="32" y2="16" stroke="#4A2C2C" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="32" cy="16" r="4" fill="#3182F6" stroke="#4A2C2C" stroke-width="3" />
  
  <!-- Right Antenna -->
  <line x1="62" y1="28" x2="68" y2="16" stroke="#4A2C2C" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="68" cy="16" r="4" fill="#3182F6" stroke="#4A2C2C" stroke-width="3" />

  <!-- Main Head -->
  <rect x="16" y="26" width="68" height="52" rx="20" fill="#D3E3FD" stroke="#4A2C2C" stroke-width="3.5" />

  <!-- Face Screen -->
  <rect x="24" y="34" width="52" height="36" rx="12" fill="#FFFFFF" stroke="#4A2C2C" stroke-width="3" />

  <!-- Hip Sleek Rectangular Glasses -->
  <!-- Left Lens -->
  <rect x="28" y="42" width="18" height="10" rx="2" fill="#2D2D2D" stroke="#4A2C2C" stroke-width="2.5" />
  <line x1="30" y1="44" x2="34" y2="44" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" />
  <!-- Right Lens -->
  <rect x="54" y="42" width="18" height="10" rx="2" fill="#2D2D2D" stroke="#4A2C2C" stroke-width="2.5" />
  <line x1="56" y1="44" x2="60" y2="44" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" />
  <!-- Bridge -->
  <rect x="46" y="45" width="8" height="3" fill="#4A2C2C" />

  <!-- Blush -->
  <circle cx="29" cy="58" r="3" fill="#FF85A1" opacity="0.4" />
  <circle cx="71" cy="58" r="3" fill="#FF85A1" opacity="0.4" />

  <!-- Smile -->
  <path d="M 46 59 Q 50 62 54 59" fill="none" stroke="#4A2C2C" stroke-width="2" stroke-linecap="round" />

  <!-- Retro Foam Headphones - Ear Cups (Orange Foam!) -->
  <rect x="10" y="42" width="9" height="20" rx="4.5" fill="#FF9500" stroke="#4A2C2C" stroke-width="3.5" />
  <rect x="81" y="42" width="9" height="20" rx="4.5" fill="#FF9500" stroke="#4A2C2C" stroke-width="3.5" />
</svg>
